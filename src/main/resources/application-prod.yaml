# ── Production profile overrides ──────────────────────────────────────────
# Active when: SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST come from environment variables or secrets manager.
# Never set default values for secrets here.

spring:
  # ── DataSource ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  # ── Flyway: migrations only (no seed data) ─────────────────────────────────
  flyway:
    locations: classpath:db/migration
    clean-disabled: true          # never allow flyway:clean in prod

  # ── Redis: may require TLS ─────────────────────────────────────────────────
  data:
    redis:
      ssl:
        enabled: ${REDIS_TLS_ENABLED:false}

# ── Swagger UI disabled in production ─────────────────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── Actuator: restrict health detail to authorized users ──────────────────
management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

# ── Logging: JSON structured logging recommended behind a log aggregator ──
logging:
  level:
    root: WARN
    com.cloudzone.shopbackend: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
