# ── Dev profile overrides ──────────────────────────────────────────────────
# Active when: -Dspring.profiles.active=dev  (or SPRING_PROFILES_ACTIVE=dev)
# Never commit secrets to this file. Use .env or IDE run-config env vars.

spring:
  # ── DataSource ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopdb}
    username: ${DB_USERNAME:shopuser}
    password: ${DB_PASSWORD:shoppass}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  # ── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: false           # set true to log queries; prefer P6Spy in prod investigation

  # ── Flyway: include seed data in dev ───────────────────────────────────────
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    clean-disabled: false         # allow flyway:clean in dev only

  # ── Mail: use MailDev locally (no auth, no TLS) ────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

# ── Swagger UI always enabled in dev ───────────────────────────────────────
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.cloudzone.shopbackend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
    io.lettuce: INFO
